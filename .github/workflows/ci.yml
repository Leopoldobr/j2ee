name: Java e integração Jakarta EE
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Baixar WildFly fixado para o laboratório
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/wildfly/wildfly-dist/35.0.1.Final/wildfly-dist-35.0.1.Final.zip -o "$RUNNER_TEMP/wildfly.zip"
          unzip -q "$RUNNER_TEMP/wildfly.zip" -d "$RUNNER_TEMP"
      - name: Testar em um servidor real
        run: bash scripts/integration.sh
        env:
          WILDFLY_HOME: ${{ runner.temp }}/wildfly-35.0.1.Final
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico
          path: |
            target/surefire-reports/
            target/wildfly*.log
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PORT: '18080'
      STARTUP_TIMEOUT: '180'
    steps:
      - uses: actions/checkout@v4
      - name: Conferir sintaxe Bash
        run: bash -n iniciar.sh
      - name: Construir imagem e iniciar pelo script
        run: ./iniciar.sh
      - name: Testar a aplicação no contêiner
        run: BASE_URL=http://127.0.0.1:18080/j2ee-patterns python3 scripts/smoke.py
      - name: Registrar logs
        if: always()
        run: docker compose logs --no-color app > docker.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico-docker
          path: docker.log
      - name: Encerrar pelo script
        if: always()
        run: ./iniciar.sh stop
